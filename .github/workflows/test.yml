name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/index.js
          node --check assets/js/author.js
          node --check assets/js/algorithms.js
          node --check assets/js/game-state.js

      - name: Check preprocessing script
        run: python -m py_compile scripts/preprocess.py